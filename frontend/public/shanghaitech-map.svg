<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <pattern id="urbanGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(53, 76, 253, 0.08)" stroke-width="1"/>
    </pattern>
    <linearGradient id="streetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#130e33"/>
      <stop offset="50%" stopColor="#1a1547"/>
      <stop offset="100%" stopColor="#130e33"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="650" fill="#060414" />
  <rect width="1000" height="650" fill="url(#urbanGrid)" />

  <!-- City Blocks -->
  <rect x="40" y="40" width="920" height="570" rx="14" fill="#0d0926" stroke="#251c63" stroke-width="2"/>

  <!-- Metro Terminal (North) -->
  <rect x="80" y="60" width="840" height="110" rx="10" fill="#150f3d" stroke="#4833c7" stroke-width="1.5"/>
  <text x="500" y="115" fill="#f0edff" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">SHANGHAITECH PEDESTRIAN CONCOURSE · METRO HUB</text>

  <!-- Boulevard Grid -->
  <rect x="120" y="200" width="760" height="260" rx="12" fill="url(#streetGrad)" stroke="#392b99" stroke-width="2"/>

  <!-- Sectors S1 to S4 -->
  <g id="sector-S1">
    <rect x="150" y="220" width="320" height="100" rx="8" fill="rgba(255, 193, 7, 0.1)" stroke="#ffc107" stroke-width="1.5"/>
    <text x="310" y="265" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" text-anchor="middle">SECTOR S1</text>
    <text x="310" y="290" fill="#ffc107" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">Metro Exit Plaza</text>
  </g>

  <g id="sector-S2">
    <rect x="530" y="220" width="320" height="100" rx="8" fill="rgba(255, 59, 92, 0.1)" stroke="#ff3b5c" stroke-width="1.5"/>
    <text x="690" y="265" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" text-anchor="middle">SECTOR S2</text>
    <text x="690" y="290" fill="#ff3b5c" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">Commercial Boulevard</text>
  </g>

  <g id="sector-S3">
    <rect x="530" y="340" width="320" height="100" rx="8" fill="rgba(0, 255, 136, 0.1)" stroke="#00ff88" stroke-width="1.5"/>
    <text x="690" y="385" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" text-anchor="middle">SECTOR S3</text>
    <text x="690" y="410" fill="#00ff88" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">Central Pedestrian Crossing</text>
  </g>

  <g id="sector-S4">
    <rect x="150" y="340" width="320" height="100" rx="8" fill="rgba(104, 84, 222, 0.1)" stroke="#6854de" stroke-width="1.5"/>
    <text x="310" y="385" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" text-anchor="middle">SECTOR S4</text>
    <text x="310" y="410" fill="#b4a9ef" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">Transit Terminal Link</text>
  </g>

  <!-- Southern Roadway -->
  <rect x="80" y="490" width="840" height="90" rx="10" fill="#150f3d" stroke="#4833c7" stroke-width="1.5"/>
  <text x="500" y="545" fill="#f0edff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" text-anchor="middle">SOUTH ARTERIAL TRAMWAY &amp; BUS LANES</text>
</svg>
